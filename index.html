<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ef">
  <title>Happy Birthday, Ab!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="sky-shape shape-one" aria-hidden="true"></div>
    <div class="sky-shape shape-two" aria-hidden="true"></div>

    <section class="birthday-card" aria-labelledby="instruction">
      <p class="date">14 · 08 · 2026</p>
      <h1 id="instruction">Blow out the<br>candles, Ab.</h1>

      <button class="cake-button" id="cakeButton" type="button" aria-label="Blow out Ab's birthday candles">
        <span class="candles" id="candles" aria-hidden="true"></span>
        <span class="cake" aria-hidden="true">
          <span class="icing"></span>
          <span class="cake-dots"></span>
          <span class="plate"></span>
        </span>
      </button>

      <p class="hint" id="hint">Tap the cake or blow into your microphone</p>
      <button class="mic-button" id="micButton" type="button">Enable blowing</button>
    </section>

    <section class="celebration" id="celebration" aria-hidden="true">
      <div class="final-message">
        <span>🎉</span>
        <h2>Happy Birthday, Ab!</h2>
        <p>🎂 🥳 🎉</p>
      </div>

      <div class="parade" aria-label="A parade of dancing animals">
        <div class="animal animal-1"><span>🐘</span><i>party stomp</i></div>
        <div class="animal animal-2"><span>🦆</span><i>tiny march</i></div>
        <div class="animal animal-3"><span>🐧</span><i>formal guest</i></div>
        <div class="animal animal-4"><span>🐒</span><i>chaos unit</i></div>
        <div class="animal animal-5"><span>🦕</span><i>late arrival</i></div>
        <div class="animal animal-6"><span>🐸</span><i>lead dancer</i></div>
      </div>

      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
