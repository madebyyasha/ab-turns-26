<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ef">
  <title>Happy Birthday, Ab!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="sky-shape shape-one" aria-hidden="true"></div>
    <div class="sky-shape shape-two" aria-hidden="true"></div>

    <section class="birthday-card" aria-labelledby="instruction">
      <p class="date">14 · 08 · 2026</p>
      <h1 id="instruction">Blow out the<br>candles, Ab.</h1>

      <button class="cake-button" id="cakeButton" type="button" aria-label="Blow out the birthday candles">
        <span class="cake-stack" aria-hidden="true">
          <span class="tier tier-bottom"><i class="tier-icing"></i><i class="pearls"></i></span>
          <span class="tier tier-middle"><i class="tier-icing"></i><i class="bows">♡</i></span>
          <span class="tier tier-top"><i class="tier-icing"></i><i class="cherries">● &nbsp; ● &nbsp; ●</i></span>
          <span class="candles" id="candles"></span>
          <span class="plate"></span>
        </span>
      </button>

      <p class="hint" id="hint">Tap the cake or blow into your microphone</p>
      <button class="mic-button" id="micButton" type="button">Enable blowing</button>
    </section>

    <section class="celebration" id="celebration" aria-hidden="true">
      <div class="final-message">
        <h2>Happy Birthday, Ab!</h2>
        <p>🎂 🥳 🎉</p>
        <button class="sound-button" id="soundButton" type="button">♫ play birthday song</button>
      </div>

      <div class="parade" aria-label="A parade of dancing animals">
        <img src="animal-parade.png" alt="A hand-drawn elephant, duck, penguin, monkey, dinosaur and frog dancing in a birthday parade">
      </div>

      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
